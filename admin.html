<script>
(function(){
"use strict";

/* ============ 常數 ============ */
var LS_DB="momo_coll_db_v1", LS_TOK="momo_coll_tok", LS_REPO="momo_coll_repo";
var REPO_DEFAULT="kwokfamilyapps/collection", BRANCH="main";
var API="https://api.github.com";
var ITER=310000;

var PUBLIC_FIELDS=["id","category","name","name_en","era","year","issuer","authenticity",
  "grade","spec","derived","photos","notes_public","history","varieties","market",
  "checklist","tags","sources","updated"];
var PRIVATE_FIELDS=["notes_private","purchase_price","acquired_from","location",
  "serial_no","valuation_private"];

var S={db:null,schema:null,cats:[],view:"list",editId:null,dirty:false,unlocked:false};

/* ============ 小工具 ============ */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function uid(){return "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function toast(msg,ms){
  var d=document.createElement("div");
  d.textContent=msg;
  d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:1.2rem;z-index:99;"+
    "background:#2f3a24;color:#fdf9ee;padding:.55rem .9rem;border-radius:.5rem;font-size:.82rem;"+
    "max-width:22rem;line-height:1.6;box-shadow:0 .2rem .8rem rgba(0,0,0,.25)";
  document.body.appendChild(d);
  setTimeout(function(){d.remove();},ms||2600);
}
function catOf(k){ var d={zh:k,emoji:"•",auth_ok:["genuine","pending"],
    auth_bad:["replica"],fields:[]};
  for(var i=0;i<S.cats.length;i++) if(S.cats[i].key===k) return S.cats[i];
  return d;}
function authLabel(k){ if(!S.schema) return k;
  for(var i=0;i<S.schema.authenticity.length;i++) if(S.schema.authenticity[i].key===k) return S.schema.authenticity[i].zh;
  return k;}
function isPublicAuth(k){
  if(!S.schema) return k==="genuine"||k==="pending";
  for(var i=0;i<S.schema.authenticity.length;i++)
    if(S.schema.authenticity[i].key===k) return !!S.schema.authenticity[i].public;
  return false;}
function badgeCls(k){return k==="genuine"||k==="natural"?"b-genuine":
  (k==="replica"||k==="composite"?"b-replica":"b-pending");}

/* 密度：ρ = 重量 ÷ [ π/4 × (直徑² − 穿徑²) × 厚度 ] */
function calcDensity(weight_g,d_mm,t_mm,h1,h2){
  if(!(weight_g>0&&d_mm>0&&t_mm>0)) return null;
  h1=(h1>0?h1:4.5)/10; h2=(h2>0?h2:6.5)/10;
  var D=d_mm/10, t=t_mm/10;
  var v1=Math.PI/4*(D*D-h1*h1)*t, v2=Math.PI/4*(D*D-h2*h2)*t;
  var a=weight_g/Math.max(v1,v2), b=weight_g/Math.min(v1,v2);
  return [Math.round(a*100)/100,Math.round(b*100)/100];
}

/* ============ 動態分類引擎 ============ */
/* 欄位中文名 → 穩定 key（冇對應就自動 gen） */
var ZH2KEY={"重量":"weight_g","尺寸":"size_cm","產地":"locality","產區":"locality",
  "材質":"material","年份":"year_make","狀態":"condition","編號":"ref_no","香味":"scent",
  "顏色":"color","珠徑":"bead_mm","珠數":"bead_count","等級":"grade_note","處理":"treatment",
  "作者":"maker","款識":"mark","窯口":"kiln","釉色":"glaze","品種":"variety",
  "油脂線":"oil_line","結油度":"resin_level","總重":"total_g","配珠":"spacer",
  "直徑":"diameter_mm","厚薄":"thickness_mm","硬度":"mohs","晶系":"crystal",
  "評級":"grade_note","版別":"issue_type","齒孔":"perf","水印":"watermark",
  "面額":"denom","冠字號碼":"serial","機芯":"movement","錶徑":"case_mm"};

/* 名稱關鍵詞 → 預設欄位模板 */
var CAT_TEMPLATES=[
 {re:/(沉香|棋楠|奇楠|檀香|降真|香材|香料|老山|線香|香粉)/,emoji:"🪵",
  fields:[["產地／產區",""],["品種",""],["結油度",""],["密度（沉水／半沉／浮水）",""],
          ["香味",""],["油脂線",""],["重量","g"],["尺寸","cm"],["年份",""]]},
 {re:/(手串|念珠|佛珠|珠鏈|串珠|手鏈|手鏈|手鐲|手環|珠寶)/,emoji:"📿",
  fields:[["主珠材質",""],["珠徑","mm"],["珠數",""],["配珠／隔珠",""],["總重","g"],["產地",""]]},
 {re:/(玉|翡翠|和田|瑪瑙|琥珀|蜜蠟|水晶|寶石)/,emoji:"💠",
  fields:[["玉種／寶石種",""],["等級／種水",""],["顏色",""],["尺寸","cm"],["重量","g"],
          ["產地",""],["雕工",""]]},
 {re:/(瓷|陶|紫砂|釉|窯)/,emoji:"🏺",
  fields:[["窯口",""],["年代",""],["釉色",""],["尺寸","cm"],["款識",""],["底足",""]]},
 {re:/(書|畫|字|卷|扇|拓)/,emoji:"🖼",
  fields:[["作者",""],["題材",""],["尺寸","cm"],["裝裱",""],["款識",""],["印章",""]]},
 {re:/(刀|劍|兵|刃)/,emoji:"⚔️",
  fields:[["類型",""],["刃長","cm"],["總長","cm"],["鋼材",""],["產地",""],["年份",""]]},
 {re:/(壺|杯|茶具|器皿|擺件|雕|木雕|石雕)/,emoji:"🫖",
  fields:[["材質",""],["尺寸","cm"],["重量","g"],["作者／工藝",""],["年代",""],["產地",""]]},
 {re:/(相機|鏡頭|音響|樂器|收音機|錶|鐘)/,emoji:"📻",
  fields:[["品牌",""],["型號",""],["年份",""],["機身編號",""],["狀態",""],["配件",""]]},
 {re:/(酒|茶|普洱|威士忌|茅台)/,emoji:"🍶",
  fields:[["品牌",""],["年份",""],["容量","ml"],["產地",""],["狀態／封膜",""],["批次",""]]},
 {re:/(化石|骨|牙|腳印)/,emoji:"🦴",
  fields:[["物種",""],["地質年代",""],["產地",""],["地層",""],["尺寸","cm"],["修復程度",""],["處理",""]]},
 {re:/(礦|石|晶|隕)/,emoji:"💎",
  fields:[["礦物種",""],["晶系",""],["硬度",""],["產地",""],["尺寸","cm"],["重量","g"],["處理",""]]}
];

var GENERIC_FIELDS=[["材質",""],["尺寸","cm"],["重量","g"],["產地",""],["年份",""],["狀態",""],["編號",""]];

function fieldKey(zh,used){
  var k=ZH2KEY[zh];
  if(!k){ k="f_"+zh.replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,"").slice(0,6); }
  if(!k) k="f";
  var base=k,n=2;
  while(used[k]){ k=base+"_"+n; n++; }
  used[k]=1;
  return k;
}
function guessTemplate(name){
  for(var i=0;i<CAT_TEMPLATES.length;i++)
    if(CAT_TEMPLATES[i].re.test(name||"")) return CAT_TEMPLATES[i];
  return {emoji:"📦",fields:GENERIC_FIELDS};
}
function makeCategory(name,emoji,fieldPairs){
  var used={}, fields=[];
  (fieldPairs||[]).forEach(function(p){
    var zh=p[0], u=p[1]||"";
    if(!zh) return;
    var num=/^(mm|cm|g|ml|kg)$/.test(u);
    fields.push({k:fieldKey(zh,used),zh:zh,u:u,t:num?"num":"text"});
  });
  var base=name.replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,"");
  var key="c_"+base+"_"+Math.random().toString(36).slice(2,5);
  return {key:key,zh:name,emoji:emoji||"📦",custom:true,
    auth_ok:["genuine","pending"],auth_bad:["replica"],fields:fields};
}
function catExists(name){
  for(var i=0;i<S.cats.length;i++){
    if(S.cats[i].zh===name || S.cats[i].key===name) return S.cats[i];
  }
  return null;
}
/* 自動加入分類（搵到就回傳，搵唔到就建立） */
function ensureCategory(name,emoji,fieldPairs){
  if(!name) return null;
  var hit=catExists(name);
  if(hit) return {cat:hit,created:false};
  var t=guessTemplate(name);
  var cat=makeCategory(name,emoji||t.emoji,fieldPairs||t.fields);
  S.cats.push(cat);
  S.db.categories=S.cats;
  return {cat:cat,created:true};
}
function itemCountOf(catKey){
  return (S.db.items||[]).filter(function(i){return i.category===catKey;}).length;
}

/* ---------- 新增分類對話框（iPhone 冇 prompt()，全部自製） ---------- */
function openNewCatDialog(cb){
  var div=document.createElement("div");
  div.id="newcatmodal";
  div.style.cssText="position:fixed;inset:0;z-index:120;background:rgba(26,26,22,.6);"+
    "display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:1rem .6rem";
  div.innerHTML='<div style="background:#f0e8d8;border-radius:.6rem;max-width:24rem;width:100%;'+
    'padding:.9rem .8rem;margin-bottom:2rem">'+
    '<h2 style="margin-top:0">＋ 新增分類</h2>'+
    '<div class="panel">'+
      '<label class="fld"><span class="lb">分類名稱</span>'+
      '<input id="nc_name" placeholder="例：沉香、手串、印章、鼻煙壺…" autocomplete="off"></label>'+
      '<label class="fld"><span class="lb">圖示（可留空 → 自動揀）</span>'+
      '<input id="nc_emoji" placeholder="例：🪵" maxlength="4" autocomplete="off"></label>'+
      '<p class="hint" id="nc_guess">打個名，就會自動建議欄位。</p>'+
    '</div>'+
    '<h3>欄位（自動建議，可以加／刪）</h3>'+
    '<div id="nc_fields"></div>'+
    '<div class="row" style="margin:.4rem 0 0"><input class="grow" id="nc_fzh" placeholder="欄位名，例：結油度" autocomplete="off">'+
    '<input id="nc_fu" placeholder="單位" style="max-width:4.6rem" autocomplete="off">'+
    '<button type="button" data-nc="addf">＋ 加</button></div>'+
    '<div class="row" style="margin-top:1rem">'+
      '<button type="button" class="pri grow" data-nc="ok">建立並選用</button>'+
      '<button type="button" data-nc="cancel">取消</button></div>'+
    "</div>";
  document.body.appendChild(div);

  var ncFields=[], touched=false;

  function drawFields(){
    var box=div.querySelector("#nc_fields");
    if(!ncFields.length){ box.innerHTML='<p class="hint">未有欄位（可以直接建立，之後再加）</p>'; return; }
    box.innerHTML=ncFields.map(function(f,i){
      return '<div class="row" style="margin-bottom:.25rem">'+
        '<span class="grow" style="font-size:.86rem;line-height:1.9">'+esc(f.zh)+
        (f.u?' <span class="hint" style="display:inline">('+esc(f.u)+")</span>":"")+"</span>"+
        '<button type="button" class="dan" data-del="'+i+'">刪</button></div>';
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll("[data-del]"),function(b){
      b.addEventListener("click",function(){
        ncFields.splice(parseInt(this.getAttribute("data-del"),10),1);
        touched=true; drawFields();
      });
    });
  }

  function guess(){
    if(touched) return;
    var nm=div.querySelector("#nc_name").value.trim();
    var t=guessTemplate(nm);
    ncFields=t.fields.map(function(p){return {zh:p[0],u:p[1]||""};});
    var em=div.querySelector("#nc_emoji");
    if(!em.value.trim()) em.placeholder="建議："+(t.emoji||"📦");
    div.querySelector("#nc_guess").innerHTML= nm
      ? "偵測到「"+esc(nm)+"」→ 自動建議 <b>"+ncFields.length+"</b> 個欄位，圖示建議 <b>"+(t.emoji||"📦")+"</b>"
      : "打個名，就會自動建議欄位。";
    drawFields();
  }

  div.querySelector("#nc_name").addEventListener("input",guess);
  div.querySelector('[data-nc="addf"]').addEventListener("click",function(){
    var zh=div.querySelector("#nc_fzh").value.trim();
    if(!zh) return;
    ncFields.push({zh:zh,u:div.querySelector("#nc_fu").value.trim()});
    div.querySelector("#nc_fzh").value=""; div.querySelector("#nc_fu").value="";
    touched=true; drawFields();
  });
  div.querySelector('[data-nc="cancel"]').addEventListener("click",function(){ div.remove(); });
  div.querySelector('[data-nc="ok"]').addEventListener("click",function(){
    var name=div.querySelector("#nc_name").value.trim();
    if(!name){ toast("請打分類名"); return; }
    var res=ensureCategory(name,div.querySelector("#nc_emoji").value.trim(),
      ncFields.map(function(f){return [f.zh,f.u];}));
    S.db.meta.updated=today();
    saveLocal();
    div.remove();
    toast((res.created?"✅ 已新增分類「":"已使用現有分類「")+res.cat.zh+"」");
    if(cb) cb(res.cat);
  });

  guess();
  div.querySelector("#nc_name").focus();
}

/* ============ 儲存 ============ */
function loadLocal(){
  try{ var raw=localStorage.getItem(LS_DB); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function saveLocal(){
  try{ localStorage.setItem(LS_DB,JSON.stringify(S.db)); S.dirty=false; }
  catch(e){ toast("本機儲存失敗（可能空間不足）："+e.message); }
}

/* ============ 加密（AES-GCM 256 + PBKDF2-SHA256） ============ */
function b64(buf){ var b=new Uint8Array(buf),s=""; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]);
  return btoa(s); }
function unb64(s){ var bin=atob(s),u=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }

function deriveKey(pw,salt,iter){
  var enc=new TextEncoder();
  return crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"])
    .then(function(base){
      return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:iter,hash:"SHA-256"},
        base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
    });
}
function encryptVault(pw,obj){
  var salt=crypto.getRandomValues(new Uint8Array(16));
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var data=new TextEncoder().encode(JSON.stringify(obj));
  return deriveKey(pw,salt,ITER).then(function(key){
    return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,data);
  }).then(function(ct){
    return {v:1,kdf:"PBKDF2-SHA256",iter:ITER,cipher:"AES-GCM-256",
      salt:b64(salt),iv:b64(iv),ct:b64(ct),items:obj.items?obj.items.length:0,
      created:new Date().toISOString()};
  });
}
function decryptVault(pw,blob){
  return deriveKey(pw,unb64(blob.salt),blob.iter||ITER).then(function(key){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(blob.iv)},key,unb64(blob.ct));
  }).then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); });
}

/* ============ GitHub ============ */
function ghToken(){ return localStorage.getItem(LS_TOK)||""; }
function ghRepo(){ return localStorage.getItem(LS_REPO)||REPO_DEFAULT; }
function gh(path,method,payload,tok){
  return fetch(API+path,{method:method||"GET",
    headers:{"Authorization":"Bearer "+(tok||ghToken()),"Accept":"application/vnd.github+json",
      "X-GitHub-Api-Version":"2022-11-28"},
    body:payload?JSON.stringify(payload):undefined
  }).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){
      return {ok:r.ok,status:r.status,data:j};
    });
  });
}
function putFile(remotePath,contentB64,message,sha){
  var repo=ghRepo();
  var payload={message:message,content:contentB64,branch:BRANCH};
  if(sha) payload.sha=sha;
  return gh("/repos/"+repo+"/contents/"+remotePath,"PUT",payload);
}
function getSha(remotePath){
  return gh("/repos/"+ghRepo()+"/contents/"+remotePath+"?ref="+BRANCH).then(function(r){
    if(r.ok&&r.data&&r.data.sha) return r.data.sha;
    if(r.status===404) return null;
    throw new Error("讀取 "+remotePath+" 失敗 ("+r.status+")");
  });
}

/* ============ 相片 ============ */
function resizeImage(file,maxDim){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var w=img.width,h=img.height,sc=Math.min(1,maxDim/Math.max(w,h));
        var cw=Math.round(w*sc),ch=Math.round(h*sc);
        var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
        cv.getContext("2d").drawImage(img,0,0,cw,ch);
        var out=cv.toDataURL("image/webp",0.84);
        if(out.indexOf("data:image/webp")!==0) out=cv.toDataURL("image/jpeg",0.85);
        res({dataUrl:out,w:cw,h:ch});
      };
      img.onerror=function(){rej(new Error("相片讀取失敗"));};
      img.src=fr.result;
    };
    fr.onerror=function(){rej(new Error("檔案讀取失敗"));};
    fr.readAsDataURL(file);
  });
}

var METALS=[
  ["純金 99.9%",19.3],["鉛",11.34],["銀 99%",10.49],["銀 90%（銀幣）",10.31],
  ["銀 85%（半圓成色）",10.23],["純銅",8.96],["白銅／銅鎳",8.9],
  ["青銅",8.7],["黃銅",8.55],["純鐵／鋼",7.87],["錫",7.3],["鋅",7.14]
];
function classifyRho(lo,hi){
  function near(a,b){ return Math.abs(a-b)<=(b*0.055); }
  if(lo>=19.0)                       return ["b-replica","密度接近純金 → 唔似流通銀／銅幣"];
  if(lo>11.6)                        return ["b-replica","密度高過鉛 11.34 → 可能鉛質或鋅合金假幣"];
  if(lo>=11.0)                       return ["b-replica","密度接近鉛 11.34 → 鉛質私鑄／假幣警號"];
  if(lo>10.55)                       return ["b-pending","略高過純銀 10.49 → 厚度可能量薄咗，或者含鉛偏高。用排水法複核體積"];
  if(near((lo+hi)/2,10.23)||(lo>=10.05&&hi<=10.55))
                                     return ["b-genuine","落銀／銀銅合金範圍 ✓（銀幣成色 80–95%）"];
  if(lo>=8.3&&hi<=9.05)              return ["b-genuine","落標準銅合金範圍 ✓（青銅／黃銅／白銅）"];
  if(hi<7.6)                         return ["b-replica","密度低過錫／鋅 → 非金屬、空心或嚴重锈蝕"];
  if(lo>=7.6&&hi<8.3)                return ["b-pending","接近鐵／錫 → 有可能係鐵錢或低質合金"];
  return ["b-pending","邊緣範圍，要配合锈色、聲音、邊齒判斷"];
}

function updDensity(){
  var spec={};
  Array.prototype.forEach.call(document.querySelectorAll("[data-fk]"),function(el){
    spec[el.getAttribute("data-fk")]=el.type==="number"?parseFloat(el.value):el.value;
  });
  var o=$("densout"); if(!o) return;
  var m=parseFloat(spec.weight_g), d=parseFloat(spec.diameter_mm), t=parseFloat(spec.thickness_mm);
  if(!m||!d||!t){ o.innerHTML="量到直徑／重量／厚度就會自動計"; return; }
  /* ① 無穿孔（銀幣／機制幣／鎳幣） */
  var vFull=Math.PI*Math.pow(d/2,2)*t/1000;
  var rhoFull=m/vFull;
  /* ② 方孔銅錢（有穿徑就精確，冇就用 4.5–6.5mm 範圍） */
  var h1=parseFloat(spec.hole_mm)||4.5, h2=(spec.hole_mm?parseFloat(spec.hole_mm):6.5);
  var v1=vFull-h1*h1*t/1000, v2=vFull-h2*h2*t/1000;
  var r1=m/v1, r2=m/v2, lo=Math.min(r1,r2), hi=Math.max(r1,r2);
  var noHole=classifyRho(rhoFull,rhoFull);
  var withHole=classifyRho(lo,hi);
  o.innerHTML=
    '<b style="font-size:1.05rem">無穿孔：'+rhoFull.toFixed(2)+" g/cm³</b>"+
      ' <span class="badge '+noHole[0]+'">'+esc(noHole[1])+"</span><br>"+
    '<b style="font-size:1.05rem">方孔 '+h1+(h2!==h1?"–"+h2:"")+" mm："+lo.toFixed(2)+" – "+hi.toFixed(2)+" g/cm³</b>"+
      ' <span class="badge '+withHole[0]+'">'+esc(withHole[1])+"</span><br>"+
    '<span class="hint">銀幣／機制幣睇上一行；方孔銅錢睇下一行。</span>'+
    '<br><span class="hint">對照：'+METALS.map(function(x){return x[0]+" "+x[1];}).join(" · ")+"</span>";
}

function collectItem(keepId){
  var spec={};
  Array.prototype.forEach.call(document.querySelectorAll("[data-fk]"),function(el){
    var v=el.value.trim();
    if(v!=="") spec[el.getAttribute("data-fk")]=el.type==="number"?parseFloat(v):v;
  });
  function lines(id){ return ($(id)?$(id).value:"").split("\n").map(function(x){return x.trim();})
    .filter(function(x){return x;}); }
  function tags(id){ return ($(id)?$(id).value:"").split(/[、,，]/).map(function(x){return x.trim();})
    .filter(function(x){return x;}); }
  var it={
    id:keepId===false?uid():(S.editId||uid()),
    category:$("f_cat").value,
    name:$("f_name").value.trim(),
    name_en:$("f_name_en").value.trim(),
    era:$("f_era").value.trim(),
    year:$("f_year").value.trim(),
    authenticity:$("f_auth").value,
    grade:"",
    spec:spec,
    photos:curPhotos.slice(),
    notes_public:$("f_notes_public").value.trim(),
    notes_private:$("f_notes_private").value.trim(),
    purchase_price:$("f_price").value.trim(),
    acquired_from:$("f_from").value.trim(),
    location:$("f_loc").value.trim(),
    tags:tags("f_tags"),
    checklist:lines("f_check"),
    history:lines("f_hist"),
    sources:lines("f_src"),
    varieties:[], market:[],
    updated:today()
  };
  var h1=spec.hole_mm||4.5, h2=spec.hole_mm||6.5;
  var r=calcDensity(spec.weight_g,spec.diameter_mm,spec.thickness_mm,h1,h2);
  it.derived={density:r,density_note:r?"由 App 自動計算（穿徑"+(spec.hole_mm?" "+spec.hole_mm+" mm":"假設 4.5–6.5 mm")+"）":""};
  return it;
}

function doSave(){
  var it=collectItem();
  if(!it.name){ toast("請填名稱"); return; }
  /* 自動加入分類：儲存時發現分類唔在清單，即刻建立 */
  if(!it.category||it.category==="__new__"||!catExists(it.category)){
    var mk=ensureCategory(it.category&&it.category!=="__new__"?it.category:(S.cats[0]?S.cats[0].zh:"其他"));
    if(mk){ it.category=mk.cat.key; if(mk.created) toast("自動新增分類「"+mk.cat.zh+"」"); }
  }
  var idx=-1;
  for(var i=0;i<S.db.items.length;i++) if(S.db.items[i].id===it.id) idx=i;
  if(idx>=0){
    /* 保留原本冇喺表單出現嘅欄位 */
    var old=S.db.items[idx];
    ["varieties","market"].forEach(function(k){ if((!it[k]||!it[k].length)&&old[k]&&old[k].length) it[k]=old[k]; });
    S.db.items[idx]=it;
  } else S.db.items.push(it);
  S.db.meta.updated=today();
  S.db.meta.count=S.db.items.length;
  saveLocal();
  S.db.meta.dirty=(S.db.meta.dirty||0)+1;
  saveLocal();
  S.view="list";
  renderTop(); renderList();
  toast(isPublicAuth(it.authenticity)
    ? "已儲存（本機）· 要按「📤 發佈上線」才上公開站"
    : "已儲存（本機）· 🔒 只存私人庫，永不會公開", 4500);
}

}

function publishAll(pw){
  var r=buildPublic();
  var db=S.db;
  var log=[];
  function step(msg){ log.push(msg); toast(msg,3000); }

  /* 1. 上載相片 */
  var jobs=[];
  var seen={};
  db.items.forEach(function(it){
    (it.photos||[]).forEach(function(p,i){
      if(p.indexOf("data:")!==0) return;
      var m=p.match(/^data:image\/(\w+);base64,(.*)$/);
      if(!m) return;
      var ext=m[1]==="jpeg"?"jpg":m[1];
      /* 內容 hash 入檔名：換相就一定換名，避免 CDN／瀏覽器餵舊圖 */
      var bstr=String(m[2]||""), hv=0;
      for(var hi=0;hi<bstr.length;hi+=97) hv=((hv<<5)-hv+bstr.charCodeAt(hi))|0;
      var hsh=Math.abs(hv).toString(36).slice(0,6)||"x";
      var safe=(it.id+"-"+(i+1)+"-"+hsh+"."+ext).replace(/[^A-Za-z0-9._-]/g,"");
      if(seen[safe]) return;
      seen[safe]=1;
      jobs.push({item:it,idx:i,name:safe,b64:m[2]});
    });
  });

  var chain=Promise.resolve();
  var uploaded=0;
  jobs.forEach(function(j){
    chain=chain.then(function(){
      step("上載相片 "+j.name+" ("+(uploaded+1)+"/"+jobs.length+")…");
      return getSha("photos/"+j.name).then(function(sha){
        return putFile("photos/"+j.name,j.b64,"photo: "+j.name,sha).then(function(res){
          if(!res.ok) throw new Error("相片上載失敗 "+j.name+" ("+res.status+") "+(res.data.message||""));
          j.item.photos[j.idx]=j.name;
          uploaded++;
        });
      });
    });
  });

  chain=chain.then(function(){
    /* 相片檔名換好 → 重建公開資料 */
    var pub=buildPublic();
    var jsonStr=JSON.stringify(pub.doc,null,1);
    var b64json=btoa(unescape(encodeURIComponent(jsonStr)));
    step("上載 data/public.json …");
    return getSha("data/public.json").then(function(sha){
      return putFile("data/public.json",b64json,"publish: "+pub.doc.items.length+" public items",sha);
    }).then(function(res){
      if(!res.ok) throw new Error("public.json 上載失敗 ("+res.status+") "+(res.data.message||""));
    });
  }).then(function(){
    /* 分類定義（自訂分類要一齊上去，公開頁才知道新分類叫咩） */
    var sd=buildSchemaDoc();
    var s64=btoa(unescape(encodeURIComponent(JSON.stringify(sd,null,1))));
    step("上載 data/schema.json（"+sd.categories.length+" 個分類）…");
    return getSha("data/schema.json").then(function(sha){
      return putFile("data/schema.json",s64,"schema: "+sd.categories.length+" categories",sha);
    }).then(function(res){
      if(!res.ok) throw new Error("schema.json 上載失敗 ("+res.status+") "+(res.data.message||""));
    });
  }).then(function(){
    step("加密 vault …");
    return encryptVault(pw,db);
  }).then(function(blob){
    var b64v=btoa(unescape(encodeURIComponent(JSON.stringify(blob,null,1))));
    step("上載 data/vault.enc.json …");
    return getSha("data/vault.enc.json").then(function(sha){
      return putFile("data/vault.enc.json",b64v,"vault: encrypted backup ("+db.items.length+" items)",sha);
    }).then(function(res){
      if(!res.ok) throw new Error("vault 上載失敗 ("+res.status+") "+(res.data.message||""));
    });
  }).then(function(){
    S.db.meta.dirty=0;
    saveLocal();
    S.view="done";
    var h='<h2>✅ 發佈完成</h2>';
    h+='<div class="panel ok"><b>已上載</b><br>相片 '+uploaded+' 張 · public.json · schema.json · vault.enc.json</div>';
    h+='<div class="panel warn"><b>⏳ GitHub Pages 要 30–60 秒重建</b><br>'+
      '<span class="sub">呢段時間開公開目錄仍然會見到舊內容，屬正常。等一分鐘再撳下面個掣。</span></div>';
    h+='<div class="panel"><span class="lb">過程</span><div class="mono">'+esc(log.slice(-8).join("\n"))+"</div></div>";
    h+='<a class="btn pri" href="index.html?v='+Date.now()+'" style="margin-top:.6rem">睇公開目錄 →</a>';
    $("app").innerHTML=h;
    toast("發佈完成");
    renderTop();
  }).catch(function(e){
    var h='<h2>⚠️ 發佈中斷</h2><div class="panel dan">'+esc(e.message)+"</div>";
    h+='<span class="back" data-act="publish">← 再試</span>';
    $("app").innerHTML=h;
  });
}

/* ---------- 本機 vs 線上 診斷 ---------- */
function doSyncCheck(){
  var box=$("syncdiag");
  if(!box) return;
  box.innerHTML="檢查中…";
  var rp=ghRepo().split("/");
  var url="https://"+rp[0]+".github.io/"+rp[1]+"/data/public.json?cb="+Date.now();
  fetch(url,{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(live){
    var liveItems=live.items||[];
    var livePh=0;
    liveItems.forEach(function(x){ livePh+=(x.photos||[]).length; });
    var mine=buildPublic().doc.items;
    var myPh=0;
    mine.forEach(function(x){ myPh+=(x.photos||[]).length; });
    var pendingPhotos=0;
    (S.db.items||[]).forEach(function(x){
      (x.photos||[]).forEach(function(p){ if(String(p).indexOf("data:")===0) pendingPhotos++; });
    });
    var dirty=S.db.meta.dirty||0;
    var L=[];
    L.push("線上公開站： "+liveItems.length+" 件 · "+livePh+" 張相 · 更新 "+((live.meta&&live.meta.updated)||"—"));
    L.push("本機公開預覽："+mine.length+" 件 · "+myPh+" 張相");
    if(pendingPhotos) L.push("⚠️ 有 "+pendingPhotos+" 張相片只存喺呢部電話，未上載");
    if(dirty) L.push("⚠️ 有 "+dirty+" 項改動未發佈");
    if(mine.length!==liveItems.length) L.push("⚠️ 件數唔同（本機 "+mine.length+" / 線上 "+liveItems.length+"）");
    if(myPh>livePh) L.push("⚠️ 線上少 "+(myPh-livePh)+" 張相");
    if(myPh<livePh) L.push("ℹ️ 線上多 "+(livePh-myPh)+" 張相（本機資料可能被重設，可用 vault 還原）");
    var okAll=(!pendingPhotos&&!dirty&&mine.length===liveItems.length&&myPh===livePh);
    L.push("");
    L.push(okAll?"✅ 已完全同步 —— 線上同本機一致"
                :"❌ 未同步 —— 撳頂部「📤 發佈上線」→ 入密碼 → 等一分鐘");
    box.innerHTML=L.map(function(x){return esc(x);}).join("<br>");
  }).catch(function(e){
    box.innerHTML="檢查失敗："+esc(e.message)+
      "<br>（網絡問題、repo 名錯，或者 Pages 啱啱發佈仍未生效）";
  });
}

function doImport(e){
  var f=e.target.files[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      if(!d.items) throw new Error("格式唔對：缺 items");
      if(!confirm("匯入 "+d.items.length+" 件，會覆蓋本機現有 "+S.db.items.length+" 件。確定？")) return;
      S.db=d; if(!S.db.meta) S.db.meta={version:1,updated:today(),densities:[]};
      saveLocal(); renderTop(); renderList(); toast("已匯入 "+d.items.length+" 件");
    }catch(err){ toast("匯入失敗："+err.message); }
  };
  fr.readAsText(f);
}

function backup(){
  var blob=new Blob([JSON.stringify(S.db,null,1)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="collection-backup-"+today()+".json";
  a.click();
  toast("已下載備份（記得放去安全地方）",4000);
}

/* ---------- 主選單事件 ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");
  if(!el) return;
  var a=el.getAttribute("data-act");
  if(a==="add"){ curPhotos=[]; openEdit(null); }
  else if(a==="newcat"){
    var back=S.view;
    openNewCatDialog(function(c){
      renderTop();
      if(back==="settings") openSettings(); else renderList();
    });
  }
  else if(a==="cancel"){ S.view="list"; renderTop(); renderList(); }
  else if(a==="save"){ doSave(); }
  else if(a==="del"){
    if(!confirm("確定刪除？呢個動作唔可以還原。")) return;
    tombstone(S.editId);
    S.db.items=S.db.items.filter(function(x){return x.id!==S.editId;});
    S.db.meta.updated=today(); saveLocal(); S.view="list"; renderTop(); renderList();
    toast("已刪除");
  }
  else if(a==="pub-preview"){ openPreview(); }
  else if(a==="publish"){ openPublish(); }
  else if(a==="do-publish"){ doPublishClick(); }
  else if(a==="synccheck"){ doSyncCheck(); }
  else if(a==="save-tok"){
    var t=$("f_tok").value.trim();
    if(!t){ toast("請貼上 token"); return; }
    localStorage.setItem(LS_TOK,t);
    toast("Token 已儲存");
    gh("/user").then(function(r){
      if(r.ok){ toast("Token 有效 · "+r.data.login,4000); openPublish(); }
      else { localStorage.removeItem(LS_TOK); toast("Token 無效 ("+r.status+")",4000); openPublish(); }
    });
  }
  else if(a==="chg-repo"||a==="settings"){ openSettings(); }
  else if(a==="set-repo"){
    var rp=$("f_repo").value.trim();
    if(!/^[\w.-]+\/[\w.-]+$/.test(rp)){ toast("格式要 owner/repo"); return; }
    localStorage.setItem(LS_REPO,rp); toast("已儲存 "+rp); openSettings();
  }
  else if(a==="clear-tok"){ localStorage.removeItem(LS_TOK); toast("已清除 token"); openSettings(); }
  else if(a==="backup"){ backup(); }
  else if(a==="pullmissing"){ pullMissing(true); }
  else if(a==="addone"){ openSingleImport(); }
  else if(a==="wipe"){
    if(!confirm("清空本機資料？雲端 vault 唔會受影響。")) return;
    localStorage.removeItem(LS_DB); S.db={meta:{version:1,updated:today(),densities:[]},items:[]};
    saveLocal(); renderTop(); renderList(); toast("已清空");
  }
  else if(a==="reseed"){ if(confirm("由 public.json 重新載入？")) seed(true); }
  else if(a==="unlock"){
    var f=$("f_vault").files[0], pw=$("f_vpw").value;
    if(!f||!pw){ toast("要揀 vault 檔＋輸入密碼"); return; }
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var blob=JSON.parse(fr.result);
        decryptVault(pw,blob).then(function(db){
          S.db=db; saveLocal(); renderTop(); renderList();
          toast("✅ 解鎖成功 · "+db.items.length+" 件");
        }).catch(function(){ toast("密碼錯或者檔案損壞"); });
      }catch(err){ toast("檔案格式錯"); }
    };
    fr.readAsText(f);
  }
});

/* ---------- 啟動 ---------- */
function mergeCats(base,extra){
  var out=[], seen={};
  (base||[]).forEach(function(c){ if(!seen[c.key]){ seen[c.key]=1; out.push(c); } });
  (extra||[]).forEach(function(c){
    if(seen[c.key]){
      for(var i=0;i<out.length;i++) if(out[i].key===c.key) out[i]=c;
    } else { seen[c.key]=1; out.push(c); }
  });
  return out;
}


/* ============ 由公開站補回／單件匯入（mvmv 交付用） ============ */
function tombstone(id){
  if(!S.db.meta) S.db.meta={version:1,updated:today(),densities:[]};
  var t=S.db.meta.deleted_ids||[];
  if(t.indexOf(id)<0) t.push(id);
  S.db.meta.deleted_ids=t;
}

function isBlankVal(v){
  if(v===undefined||v===null||v==="") return true;
  if(Object.prototype.toString.call(v)==="[object Array]") return v.length===0;
  if(typeof v==="object"&&v) return Object.keys(v).length===0;
  return false;
}
function fillEmptyKeys(tgt,inc){
  var changed=false;
  Object.keys(inc).forEach(function(k){
    if(isBlankVal(inc[k])) return;
    if(k==="spec"||k==="derived"){
      if(isBlankVal(tgt[k])){ tgt[k]=inc[k]; changed=true; return; }
      if(tgt[k]&&typeof tgt[k]==="object"){
        Object.keys(inc[k]).forEach(function(s){
          if(isBlankVal(inc[k][s])) return;
          if(isBlankVal(tgt[k][s])){ tgt[k][s]=inc[k][s]; changed=true; }
        });
      }
      return;
    }
    if(isBlankVal(tgt[k])){ tgt[k]=inc[k]; changed=true; }
  });
  return changed;
}
function mergeItems(payload,opts){
  opts=opts||{};
  var arr=[];
  if(payload&&payload.items) arr=payload.items;
  else if(Object.prototype.toString.call(payload)==="[object Array]") arr=payload;
  else if(payload&&payload.id) arr=[payload];
  var deleted=(S.db.meta&&S.db.meta.deleted_ids)||[];
  var n=0,skipped=0;
  arr.forEach(function(inc){
    if(!inc||!inc.id) return;
    if(deleted.indexOf(inc.id)>=0){ skipped++; return; }
    var idx=-1,i;
    for(i=0;i<S.db.items.length;i++){ if(S.db.items[i].id===inc.id){ idx=i; break; } }
    if(idx>=0){
      if(opts.overwrite){ S.db.items[idx]=inc; n++; }
      else if(opts.fillEmpty && fillEmptyKeys(S.db.items[idx],inc)) n++;
      return;
    }
    S.db.items.push(inc); n++;
  });
  if(n){
    S.db.meta.updated=today();
    S.db.meta.count=S.db.items.length;
    if(opts.dirty) S.db.meta.dirty=(S.db.meta.dirty||0)+n;
    saveLocal(); renderTop(); renderList();
  }
  return {n:n,skipped:skipped};
}
function pullMissing(interactive){
  return fetch("data/public.json?cb="+Date.now(),{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(pub){
      var res=mergeItems({items:(pub&&pub.items)||[]},{overwrite:false,fillEmpty:true,dirty:false});
      if(interactive) toast(res.n?("✅ 由公開站補回 "+res.n+" 件"):"公開站冇新藏品（本機已齊）",6000);
      return res;
    })
    .catch(function(e){ if(interactive) toast("讀公開站失敗："+e.message,5000); return {n:0,err:e.message}; });
}
function autoPull(){
  /* 靜默補回：公開站有、本機冇嘅藏品（唔覆蓋本機改動；刪過嘅 id 有墓碑唔會復活） */
  pullMissing(false).then(function(r){ if(r&&r.n) toast("🔄 由公開站補回 "+r.n+" 件新藏品",5000); });
}
function decodeB64Utf8(s){
  s=s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4) s+="=";
  var bin=atob(s), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function tryUrlParams(){
  var q=location.search||"";
  var mA=q.match(/[?&](?:add|additem)=([^&]+)/);
  if(mA){
    try{
      var res=mergeItems(JSON.parse(decodeB64Utf8(mA[1])),{overwrite:true,dirty:true});
      try{ history.replaceState(null,"",location.pathname+location.hash); }catch(e){}
      toast(res.n?("✅ 已加入 "+res.n+" 件 · 記得撳 📤 發佈上線"):"連結內冇有效物件",8000);
    }catch(err){ toast("匯入連結解碼失敗："+err.message,6000); }
    return;
  }
  if(/[?&]pull=1/.test(q)){
    try{ history.replaceState(null,"",location.pathname+location.hash); }catch(e){}
    pullMissing(true);
  }
}
function openSingleImport(){
  var old=document.getElementById("siWrap"); if(old) old.remove();
  var d=document.createElement("div");
  d.id="siWrap";
  d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:flex-end;overflow:auto";
  d.innerHTML='<div style="background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px">'
    +'<b style="font-size:20px">📥 加入單件藏品</b>'
    +'<p style="font-size:15px;margin:6px 0 10px;color:#666">貼上 JSON（一件物件，或 {"items":[...]}）。同 id 會覆蓋，新 id 會加入，其他藏品不受影響。</p>'
    +'<textarea id="siText" style="width:100%;height:32vh;font-size:15px;font-family:monospace;padding:8px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box"></textarea>'
    +'<div class="row" style="margin-top:10px">'
    +'<button id="siCancel" style="flex:1 1 6rem">取消</button>'
    +'<button id="siOk" style="flex:1 1 6rem">加入</button></div></div>';
  document.body.appendChild(d);
  d.querySelector("#siCancel").addEventListener("click",function(){ d.remove(); });
  d.querySelector("#siOk").addEventListener("click",function(){
    try{
      var res=mergeItems(JSON.parse(d.querySelector("#siText").value||"{}"),{overwrite:true,dirty:true});
      d.remove();
      toast(res.n?("✅ 已加入／更新 "+res.n+" 件 · 記得撳 📤 發佈上線"):"冇有效物件（要有 id）",6000);
    }catch(err){ toast("JSON 格式錯："+err.message,5000); }
  });
}

function seed(force){
  var local=force?null:loadLocal();
  var jobs=[
    fetch("data/public.json",{cache:"no-cache"}).then(function(r){return r.json();}).catch(function(){return null;}),
    fetch("data/schema.json",{cache:"no-cache"}).then(function(r){return r.json();}).catch(function(){return null;})
  ];
  Promise.all(jobs).then(function(res){
    var pub=res[0], sch=res[1];
    S.schema=sch||{authenticity:null,categories:[]};
    var baseCats=(sch&&sch.categories)?sch.categories.slice():[];
    var baseDens=(pub&&pub.meta&&pub.meta.densities)||[];

    if(local && local.items && local.items.length){
      S.db=local;
      if(!S.db.meta) S.db.meta={version:1,updated:today(),densities:baseDens};
      if(!S.db.meta.densities||!S.db.meta.densities.length) S.db.meta.densities=baseDens;
      /* 分類合併：檔案嘅基礎分類 + 本機新增嘅自訂分類 */
      S.cats=mergeCats(baseCats,S.db.categories||[]);
    } else {
      S.db={meta:{version:1,updated:(pub&&pub.meta&&pub.meta.updated)||today(),
        densities:baseDens},items:(pub&&pub.items)||[],categories:baseCats};
      S.cats=baseCats.slice();
    }
    S.db.categories=S.cats;
    saveLocal();
    renderTop(); renderList();
    tryUrlParams();
    autoPull();
  }).catch(function(e){
    $("app").innerHTML='<div class="panel dan">載入失敗：'+esc(e.message)+
      '<br><span class="hint">要由 https 或 http 開，唔可以用 file://（瀏覽器限制）。</span></div>';
  });
}

seed(false);

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
})();
